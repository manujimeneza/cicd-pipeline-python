name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Run Black (Formatter)
        run: black app --check

      - name: Run Pylint (Linter)
        run: pylint app --exit-zero --output-format=text > pylint-report.txt

      - name: Run Flake8 (Linter)
        run: flake8 app --exit-zero --output-file=flake8-report.txt

      - name: Run Unit and Component Tests
        run: pytest --ignore=tests/test_acceptance_app.py --cov-fail-under=80

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Start container
        run: |
          FLASK_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')
          docker run -d --name calculadora -p 8000:8000 -e FLASK_SECRET_KEY="$FLASK_SECRET_KEY" "$IMAGE_NAME:${{ github.sha }}"
          timeout 30 bash -c 'until curl -sf http://localhost:8000 > /dev/null; do sleep 1; done'

      - name: Run Acceptance Tests
        env:
          APP_BASE_URL: http://localhost:8000
        run: pytest tests/test_acceptance_app.py --no-cov --html=acceptance-report.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs calculadora || true

      - name: Upload Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            htmlcov/
            report.html
            acceptance-report.html
            coverage.xml
            pylint-report.txt
            flake8-report.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
